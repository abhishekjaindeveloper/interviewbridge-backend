spring.application.name=interview-bridge-backend
server.address=0.0.0.0
server.port=${PORT:9000}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interview_bridge_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
