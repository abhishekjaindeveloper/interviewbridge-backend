spring.application.name=interview-bridge-backend
server.address=0.0.0.0
server.port=${PORT:9000}

# Default Active Profile
spring.profiles.active=dev

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interview_bridge_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:Admin@123}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5000,http://localhost:9000,http://10.73.240.94:3000,http://10.73.240.94:9000,http://10.73.240.94:5000,http://10.73.240.94:8080}
